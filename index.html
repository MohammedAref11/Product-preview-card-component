<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Frontend Mentor | Product preview card component</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css"> 
  <!-- Preload Fonts -->
  <link rel="preload" 
        href="./fonts/Montserrat-font-variable.woff2" 
        type="font/woff2"
        as="font"
        crossorigin /> 
  <link rel="preload" 
        href="./fonts/Fraunces-font-variable.woff2"
        type="font/woff2"
        as="font"
        crossorigin />
</head>
<body>


  <div class="product-card__container">
      <div class="product-card__image-container">
        <img src="./images/image-product-mobile.jpg" alt="Channel perfume" class="product-card__image-mobile">
        <img src="./images/image-product-desktop.jpg" alt="" class="product-card__image-desktop">
      </div>
      <div class="product-card__text-container">
        <p class="product-card__tag">Perfume</p>
        <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="product-card__description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="product-card__price">
          <span class="product-card__price--after">$149.99</span>
          <span class="product-card__price--before">$169.99</span>
        </div>
        <a href="#" class="product-card__cta">Add to Cart</a>
      </div>
  </div>
  
  

</body>
</html>
